variables:
  LAYER_01: "01_core_infra"
  LAYER_02: "02_observability"
  LAYER_03: "03_landing_zone"

stages:
  - test

default:
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]

# -----terraform validate実行用job-----
validate_job:
  stage: test
  before_script:
    - echo "Changing directory to: ${TARGET_LAYER}"
    - pwd; ls -a
    - cd terraform/${TARGET_LAYER}/env/dev

  script:
    - ./scripts/validate.sh ${TARGET_LAYER}

  rules:
    - changes:
      - "terraform/${TARGET_LAYER}/**/*"  # 指定されたレイヤーのディレクトリ配下が変更された時だけ実行
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # マージリクエスト後（Merge前）のみ実行
    - if: $CI_PIPELINE_SOURCE == "web" # (テスト用)手動で実行したときのみ実行

  parallel:
    matrix:
      - TARGET_LAYER: [LAYER_01, LAYER_02, LAYER_03]
