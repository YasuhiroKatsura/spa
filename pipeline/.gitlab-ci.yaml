variables:
  TERRAFORM_VERSION: "1.15.1"
  TFLINT_VERSION: "v0.50.0"
  GITLEAKS_VERSION: "v8.30.1"
  AWS_ENV: "dev"
  CI_SCRIPTS_DIR: "$CI_PROJECT_DIR/pipeline/scripts"

# TFLint pluginのダウンロード結果をキャッシュ
cache:
  key: tflint-${CI_COMMIT_REF_SLUG} # branchごとにキャッシュを分ける
  paths:
    - .tflint.d/plugins/

stages:
  - lint
  - plan

before_script:
  - echo "Adding execute permission to scripts"
  - chmod +x $CI_PROJECT_DIR/pipeline/scripts/* # pipeline用scriptに実行権限を付与

tflint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:${TFLINT_VERSION}
    entrypoint: [""]
  script:
    - $CI_SCRIPTS_DIR/tf_lint.sh $AWS_ENV
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # マージリクエスト時に実行

gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:${GITLEAKS_VERSION}
    entrypoint: [""]
  script:
    - $CI_SCRIPTS_DIR/gitleaks.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

terraform-fmt:
  stage: lint
  image:
    name: hashicorp/terraform:${TERRAFORM_VERSION}
    entrypoint: [""]
  script:
    - $CI_SCRIPTS_DIR/tf_fmt.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # マージリクエスト時に実行

dry_run:
  stage: plan
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  variables:
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - $CI_PROJECT_DIR/pipeline/scripts/tf_plan.sh $AWS_ENV
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" # pushの時だけ実行