variables:
  AWS_ENV: "dev"
  LAYER_01: "01_core_infra"
  LAYER_02: "02_observability"
  LAYER_03: "03_landing_zone"

stages:
  - test

default:
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]

before_script:
  - echo "Adding execute permission to scripts"
  - chmod +x $CI_PROJECT_DIR/pipeline/scripts/*

# -----main branchのみ: terraform validateを実行-----
main_validate_job:
  stage: test

  script:
    - $CI_PROJECT_DIR/pipeline/scripts/validate.sh $AWS_ENV $TARGET_LAYER

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # マージリクエスト後（Merge前）のみ実行

  parallel:
    matrix:
      - TARGET_LAYER: [$LAYER_01, $LAYER_02, $LAYER_03]

