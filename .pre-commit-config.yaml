# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks
        entry: gitleaks detect --staged --verbose
        language: system
        pass_filenames: false

      - id: tflint
        name: tfLint
        entry: bash -c 'cd terraform/env/dev/ && tflint --config=__GIT_WORKING_DIR__/terraform.tflint.hcl'
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$
        pass_filenames: false

      - id: terraform-fmt
        name: Terraform fmt
        entry: terraform fmt
        args: ['-diff']
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$

      - id: terraform-validate
        name: Terraform validate
        entry: bash -c 'cd terraform/env/dev/ && terraform validate'
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$
        pass_filenames: false

      

