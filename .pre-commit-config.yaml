# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict

-   repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false

      - id: tflint-init
        name: tflint init
        entry: tflint --chdir=terraform/env/dev --config=../../.tflint.hcl --init
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$
        pass_filenames: false
        verbose: true

      - id: tflint
        name: tflint
        entry: tflint --chdir=terraform/env/dev --config=../../.tflint.hcl
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$
        pass_filenames: false
        verbose: true

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -diff -recursive terraform/
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$

      - id: terraform-validate
        name: terraform validate
        entry: terraform -chdir=terraform/env/dev validate -no-color
        language: system
        types: [terraform]
        files: ^terraform/env/.*\.tf$
        pass_filenames: false
        verbose: true
